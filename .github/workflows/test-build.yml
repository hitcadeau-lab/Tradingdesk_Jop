# Testversie: bij elke push naar een werkbranch (claude/...) bouwt GitHub
# "Tradingdesk Test". Die app staat los naast je echte app, gebruikt een eigen
# datamap (iCloud Drive/Tradingdesk Test) en werkt zichzelf niet bij.
# Er wordt NIETS gepubliceerd: de .dmg staat als download bij de build.
name: Testversie Mac-app

on:
  push:
    branches: ["claude/**"]
    paths: ["index.html", "css/**", "js/**", "desktop/**", ".github/workflows/**"]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Installeren en testen
        run: |
          npm ci
          npm test

      - name: Instellen als testversie
        run: |
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.tradingdesk.channel = "test";
            p.build.productName = "Tradingdesk Test";
            p.build.appId = "nl.tradingdesk.test";
            p.build.mac.artifactName = "Tradingdesk-Test-${version}-mac.${ext}";
            p.build.dmg.title = "Tradingdesk Test ${version}";
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2));
          '

      - name: Testapp bouwen
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run copy-web && npx electron-builder --mac dmg --universal --publish never

      - name: Testversie klaarzetten als download
        uses: actions/upload-artifact@v4
        with:
          name: Tradingdesk-Test-mac
          path: desktop/dist/*.dmg
          retention-days: 14
          compression-level: 0
