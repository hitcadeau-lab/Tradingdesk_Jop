# Bouwt de Mac-app en publiceert een GitHub Release zodra er op main een
# nieuwe versie (desktop/package.json) staat. Dus pas nadat je de pull request
# hebt goedgekeurd en samengevoegd. De release bevat:
#  - Tradingdesk-<versie>-mac.dmg / .zip  (installatie, universal: Apple Silicon + Intel)
#  - web-<versie>.zip                      (app-inhoud voor updates met één klik)
#  - latest.json                           (wat de app leest om updates te vinden)
name: Release Mac-app

on:
  push:
    branches: [main]
    paths: ["index.html", "css/**", "js/**", "desktop/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Versie bepalen
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$V bestaat al: niets te doen (verhoog de versie voor een nieuwe release)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Installeren en testen
        if: steps.ver.outputs.skip != 'true'
        run: |
          npm ci
          npm test

      - name: Mac-app bouwen
        if: steps.ver.outputs.skip != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: Web-bundel en latest.json maken
        if: steps.ver.outputs.skip != 'true'
        run: |
          V=${{ steps.ver.outputs.version }}
          (cd web && zip -qr "../dist/web-$V.zip" .)
          NOTES=$(git log -1 --pretty=%s)
          node -e '
            const p = require("./package.json");
            const v = p.version;
            require("fs").writeFileSync("dist/latest.json", JSON.stringify({
              version: v,
              minShell: p.tradingdesk.shellVersion,
              web: `web-${v}.zip`,
              dmg: `Tradingdesk-${v}-mac.dmg`,
              notes: process.argv[1].slice(0, 140)
            }, null, 2));
          ' "$NOTES"
          ls -la dist

      - name: Release publiceren
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.ver.outputs.version }}
          gh release create "v$V" \
            "dist/Tradingdesk-$V-mac.dmg" \
            "dist/Tradingdesk-$V-mac.zip" \
            "dist/web-$V.zip" \
            "dist/latest.json" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Tradingdesk $V" \
            --notes "$(git log -1 --pretty=%B)" \
            --latest
